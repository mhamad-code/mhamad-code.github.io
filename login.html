<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Mhamad</title>
    <meta name="description" content="Log in or create an account.">
    <link rel="icon" href="assets/avatar.jpg">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/auth.css">
    <script src="js/theme.js"></script>
</head>

<body class="auth-page">
    <div class="bg-circle bg1"></div>
    <div class="bg-circle bg2"></div>
    <div class="bg-circle bg3"></div>

    <a class="switch-circle back-home" href="index.html" aria-label="Back to home">
        <i class="fa-solid fa-house"></i>
    </a>
    <a class="switch-circle back-home right" href="settings.html" aria-label="Settings"><i class="fa-solid fa-gear"></i></a>

    <div class="auth-wrapper">
        <div class="auth-card" id="authCard">

            <!-- Login -->
            <div class="form-panel login-panel">
                <div class="logo">
                    <img src="assets/avatar.jpg" alt="Mhamad">
                </div>
                <h1>Welcome</h1>
                <p class="subtitle">Login to continue your journey</p>

                <form id="loginForm">
                    <div class="input-group">
                        <div class="electric-glow"></div>
                        <div class="electric-border"></div>
                        <input type="email" id="loginEmail" placeholder=" " autocomplete="email" required>
                        <label for="loginEmail">Email Address</label>
                    </div>

                    <div class="input-group">
                        <div class="electric-glow"></div>
                        <div class="electric-border"></div>
                        <input type="password" id="loginPassword" placeholder=" " autocomplete="current-password" required>
                        <label for="loginPassword">Password</label>
                        <button type="button" class="password-toggle" data-toggle="loginPassword" aria-label="Show or hide password">
                            <i class="fa-solid fa-eye"></i>
                        </button>
                    </div>

                    <div class="options">
                        <label class="checkbox">
                            <input type="checkbox" id="rememberMe" checked>
                            Remember me
                        </label>
                        <button type="button" class="link" id="forgotBtn">Forgot Password?</button>
                    </div>
                    <button type="submit" class="main-btn">Login</button>
                    <p class="auth-msg" id="loginMsg" aria-live="polite"></p>
                </form>

                <div class="divider">or continue with</div>
                <div class="social-row">
                    <button type="button" class="main-btn" data-provider="google">
                        <i class="fa-brands fa-google"></i> Google
                    </button>
                    <button type="button" class="main-btn" data-provider="github">
                        <i class="fa-brands fa-github"></i> GitHub
                    </button>
                </div>

                <div class="switch-area">
                    <span>Don’t have an account?</span>
                    <button type="button" class="switch-circle" data-flip aria-label="Create an account">
                        <i class="fa-solid fa-plus"></i>
                    </button>
                </div>
            </div>

            <!-- Sign up -->
            <div class="form-panel signup-panel">
                <div class="logo">
                    <img src="assets/avatar.jpg" alt="Mhamad">
                </div>
                <h1>Create Account</h1>
                <p class="subtitle">Start your journey with us</p>

                <form id="signupForm">
                    <div class="input-group">
                        <div class="electric-glow"></div>
                        <div class="electric-border"></div>
                        <input type="text" id="signupName" placeholder=" " autocomplete="name" required>
                        <label for="signupName">Full Name</label>
                    </div>

                    <div class="input-group">
                        <div class="electric-glow"></div>
                        <div class="electric-border"></div>
                        <input type="email" id="signupEmail" placeholder=" " autocomplete="email" required>
                        <label for="signupEmail">Email Address</label>
                    </div>

                    <div class="input-group">
                        <div class="electric-glow"></div>
                        <div class="electric-border"></div>
                        <input type="password" id="signupPassword" placeholder=" " autocomplete="new-password" required>
                        <label for="signupPassword">Password</label>
                        <button type="button" class="password-toggle" data-toggle="signupPassword" aria-label="Show or hide password">
                            <i class="fa-solid fa-eye"></i>
                        </button>
                    </div>

                    <div class="input-group">
                        <div class="electric-glow"></div>
                        <div class="electric-border"></div>
                        <input type="password" id="confirmPassword" placeholder=" " autocomplete="new-password" required>
                        <label for="confirmPassword">Confirm Password</label>
                    </div>

                    <button type="submit" class="main-btn">CREATE ACCOUNT</button>
                    <p class="auth-msg" id="signupMsg" aria-live="polite"></p>
                </form>

                <div class="divider">or continue with</div>
                <div class="social-row">
                    <button type="button" class="main-btn" data-provider="google">
                        <i class="fa-brands fa-google"></i> Google
                    </button>
                    <button type="button" class="main-btn" data-provider="github">
                        <i class="fa-brands fa-github"></i> GitHub
                    </button>
                </div>

                <div class="switch-area">
                    <span>Already have an account?</span>
                    <button type="button" class="switch-circle" data-flip aria-label="Back to login">
                        <i class="fa-solid fa-arrow-left"></i>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="js/login.js"></script>
</body>

</html>
