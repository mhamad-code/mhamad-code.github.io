    <main>
        <section class="section" style="margin-top: 60px;">
            <div class="section-head">
                <h2>Tools</h2>
                <p>Small helpers that run in your browser. Nothing you type is sent anywhere.</p>
            </div>

            <div class="tool-tabs" role="tablist" aria-label="Tools">
                <button type="button" class="skill tab" role="tab" id="tab-qr" aria-controls="tool-qr" aria-selected="true"><i class="fa-solid fa-qrcode"></i>QR code</button>
                <button type="button" class="skill tab" role="tab" id="tab-password" aria-controls="tool-password" aria-selected="false"><i class="fa-solid fa-key"></i>Password</button>
                <button type="button" class="skill tab" role="tab" id="tab-json" aria-controls="tool-json" aria-selected="false"><i class="fa-solid fa-code"></i>JSON</button>
                <button type="button" class="skill tab" role="tab" id="tab-color" aria-controls="tool-color" aria-selected="false"><i class="fa-solid fa-palette"></i>Colors</button>
            </div>

            <!-- QR code -->
            <div class="settings-card tool-panel" role="tabpanel" id="tool-qr" aria-labelledby="tab-qr">
                <div class="input-group" data-icon="fa-link">
                        <div class="electric-glow"></div>
                        <div class="electric-border"></div>
                        <input type="text" id="qrText" placeholder=" " autocomplete="off" spellcheck="false">
                        <label for="qrText">Text or link</label>
                    </div>
                <label class="opt" for="qrSize">
                    <span>Size</span>
                    <input type="range" id="qrSize" min="160" max="640" step="20" value="320">
                    <output id="qrSizeOut">320</output>
                </label>
                <div class="opt-row">
                    <label class="opt"><span>Code color</span><input type="color" id="qrFg" class="color-dot" value="#000000"></label>
                    <label class="opt"><span>Background</span><input type="color" id="qrBg" class="color-dot" value="#ffffff"></label>
                </div>
                <div class="qr-stage" hidden><canvas id="qrCanvas" aria-label="QR code preview"></canvas></div>
                <p class="form-msg" id="qrMsg" aria-live="polite"></p>
                <div class="tool-actions">
                    <button type="button" class="main-btn btn-inline btn-small" id="qrPng" disabled><i class="fa-solid fa-download"></i> PNG</button>
                    <button type="button" class="main-btn btn-inline btn-small" id="qrSvg" disabled><i class="fa-solid fa-download"></i> SVG</button>
                </div>
            </div>

            <!-- Password generator -->
            <div class="settings-card tool-panel" role="tabpanel" id="tool-password" aria-labelledby="tab-password" hidden>
                <div class="tool-row">
                    <div class="input-group" data-icon="fa-key">
                        <div class="electric-glow"></div>
                        <div class="electric-border"></div>
                        <input type="text" id="pwOut" placeholder=" " autocomplete="off" spellcheck="false" readonly>
                        <label for="pwOut">Your password</label>
                    </div>
                    <button type="button" class="switch-circle icon-btn" id="pwNew" aria-label="Generate a new password" title="New password"><i class="fa-solid fa-rotate"></i></button>
                    <button type="button" class="switch-circle icon-btn" id="pwCopy" aria-label="Copy password" title="Copy"><i class="fa-regular fa-copy"></i></button>
                </div>
                <div class="meter" aria-hidden="true"><i id="pwBar"></i></div>
                <p class="meter-label" id="pwLabel" aria-live="polite"></p>
                <label class="opt" for="pwLen">
                    <span>Length</span>
                    <input type="range" id="pwLen" min="8" max="64" value="16">
                    <output id="pwLenOut">16</output>
                </label>
                <div class="checks">
                    <label class="check"><input type="checkbox" id="pwUpper" checked> Uppercase (A-Z)</label>
                    <label class="check"><input type="checkbox" id="pwLower" checked> Lowercase (a-z)</label>
                    <label class="check"><input type="checkbox" id="pwDigits" checked> Numbers (0-9)</label>
                    <label class="check"><input type="checkbox" id="pwSymbols" checked> Symbols (!@#$)</label>
                    <label class="check"><input type="checkbox" id="pwClean"> Avoid look-alikes (l, 1, O, 0)</label>
                </div>
                <p class="form-msg" id="pwMsg" aria-live="polite"></p>
            </div>

            <!-- JSON formatter -->
            <div class="settings-card tool-panel" role="tabpanel" id="tool-json" aria-labelledby="tab-json" hidden>
                <div class="input-group textarea tall tool-code" data-icon="fa-code">
                    <div class="electric-glow"></div>
                    <div class="electric-border"></div>
                    <textarea id="jsonIn" placeholder=" " spellcheck="false" autocomplete="off" autocapitalize="off" wrap="off"></textarea>
                    <label for="jsonIn">Paste your JSON here</label>
                </div>
                <p class="form-msg" id="jsonMsg" aria-live="polite"></p>
                <div class="tool-actions">
                    <button type="button" class="main-btn btn-inline btn-small" id="jsonFormat">Format</button>
                    <button type="button" class="main-btn btn-inline btn-small" id="jsonMinify">Minify</button>
                    <button type="button" class="switch-circle icon-btn" id="jsonCopy" aria-label="Copy" title="Copy"><i class="fa-regular fa-copy"></i></button>
                    <button type="button" class="switch-circle icon-btn" id="jsonDownload" aria-label="Download as .json" title="Download"><i class="fa-solid fa-download"></i></button>
                    <button type="button" class="switch-circle icon-btn" id="jsonClear" aria-label="Clear" title="Clear"><i class="fa-solid fa-trash"></i></button>
                </div>
            </div>

            <!-- Color converter -->
            <div class="settings-card tool-panel" role="tabpanel" id="tool-color" aria-labelledby="tab-color" hidden>
                <input type="color" id="colorPick" class="color-big" value="#0072ff" aria-label="Pick a color">
                <div class="tool-row">
                    <div class="input-group" data-icon="fa-hashtag">
                        <div class="electric-glow"></div>
                        <div class="electric-border"></div>
                        <input type="text" id="colorHex" placeholder=" " autocomplete="off" spellcheck="false">
                        <label for="colorHex">HEX</label>
                    </div>
                    <button type="button" class="switch-circle icon-btn" data-copy="colorHex" aria-label="Copy HEX" title="Copy"><i class="fa-regular fa-copy"></i></button>
                </div>
                <div class="tool-row">
                    <div class="input-group" data-icon="fa-droplet">
                        <div class="electric-glow"></div>
                        <div class="electric-border"></div>
                        <input type="text" id="colorRgb" placeholder=" " autocomplete="off" spellcheck="false">
                        <label for="colorRgb">RGB</label>
                    </div>
                    <button type="button" class="switch-circle icon-btn" data-copy="colorRgb" aria-label="Copy RGB" title="Copy"><i class="fa-regular fa-copy"></i></button>
                </div>
                <div class="tool-row">
                    <div class="input-group" data-icon="fa-sliders">
                        <div class="electric-glow"></div>
                        <div class="electric-border"></div>
                        <input type="text" id="colorHsl" placeholder=" " autocomplete="off" spellcheck="false">
                        <label for="colorHsl">HSL</label>
                    </div>
                    <button type="button" class="switch-circle icon-btn" data-copy="colorHsl" aria-label="Copy HSL" title="Copy"><i class="fa-regular fa-copy"></i></button>
                </div>
                <p class="form-msg" id="colorMsg" aria-live="polite"></p>
                <p class="meter-label" id="colorInfo"></p>
            </div>
